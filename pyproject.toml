[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control-plane"
version = "0.1.0"
description = "The dumb, security-first orchestrator of the Decision OS: routes actions to the kernel, validates the kernel signature at runtime, enforces token-bound execution. Holds NO authority."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Ali Pourrahim" }]
# Consumes the pinned core packages. Private repos -> CI needs a read credential
# (see the repo README / contracts-spec INTEGRATION.md).
dependencies = [
  "decision-os-contracts @ git+https://github.com/Aliipou/contracts-spec.git@v0.2.0",
  "decision-kernel-core @ git+https://github.com/Aliipou/decision-kernel-core.git@v0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["control_plane"]

# The core deps are pinned by git ref (see [project.dependencies]); hatchling
# requires this opt-in to accept direct references as valid metadata.
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
# The pinned core packages (kernel, decision_os_contracts) ship no py.typed
# marker yet; ignore their untyped imports rather than vendor stubs.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
